name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build && npx electron-builder --win --publish never
      - id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/ModpackLauncher*.exe
            dist/latest.yml

  build-mac:
    runs-on: macos-latest
    # La notarizacion no tiene timeout propio: si Apple no responde, el job se
    # quedaria colgado hasta el limite de 6 horas gastando minutos de runner.
    # Dos arquitecturas, cada una con su notarizacion de hasta 35 minutos.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      # Con los secrets de Apple configurados firma y notariza; sin ellos hace
      # el build de siempre con firma ad-hoc, para no romper la release.
      - name: Build macOS
        env:
          # Deliberadamente NO se llaman CSC_LINK/CSC_KEY_PASSWORD: con esos
          # nombres electron-builder monta el llavero por su cuenta, y lo hace
          # mal — pasa la contraseña del .p12 a `security set-key-partition-list`,
          # que espera la del llavero, y falla con "passphrase not correct".
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # Sin el prefijo APPLE_API_: basta con que electron-builder vea una
          # de esas variables para que intente notarizar por su cuenta, o para
          # que aborte exigiendo las otras dos.
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NOTARY_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          # Traza del proceso de notarizacion, que por defecto no imprime nada
          # mientras espera a Apple.
        run: |
          npm run build
          if [ -n "$MAC_CSC_LINK" ] && [ -n "$NOTARY_KEY_ID" ]; then
            echo "Firmando y notarizando con Developer ID"

            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

            echo "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
              -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            rm -f "$RUNNER_TEMP/cert.p12"

            export CSC_KEYCHAIN="$KEYCHAIN"
            # Sin el prefijo "Developer ID Application:": electron-builder elige
            # el tipo de certificado por su cuenta y rechaza el nombre completo.
            CSC_NAME=$(security find-identity -v -p codesigning "$KEYCHAIN" \
              | head -1 | sed -E 's/.*"Developer ID Application: (.*)".*/\1/')
            export CSC_NAME
            echo "Identidad de firma: $CSC_NAME"

            # notarytool quiere la clave como fichero, no como variable
            printf '%s' "$NOTARY_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
            export NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8"
            npx electron-builder --mac --publish never
          else
            echo "Sin secrets de Apple: build sin notarizar"
            npx electron-builder --mac --publish never
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-mac
          path: |
            dist/ModpackLauncher*.dmg
            dist/ModpackLauncher*.zip
            dist/latest-mac.yml

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build && npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/ModpackLauncher*.AppImage
            dist/latest-linux.yml

  release:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: dist-mac
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ModpackLauncher ${{ needs.build-windows.outputs.version }}
          files: dist/*
          generate_release_notes: false

      - name: Update update.json
        env:
          TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          WIN_EXE="ModpackLauncher Setup ${VERSION}.exe"
          WIN_URL="https://github.com/Fport1/modpacklauncher/releases/download/v${VERSION}/${WIN_EXE// /.}"

          # El actualizador de 1.8.x admite una sola URL por plataforma. El DMG
          # de Intel arranca en todos los Mac (en Apple Silicon, con Rosetta), y
          # desde 1.9 electron-updater detecta Rosetta y pasa esos equipos a la
          # version arm64 en la siguiente actualizacion. El de arm64 en cambio no
          # arranca en un Mac Intel, y es el que salia primero al listar.
          MAC_DMG=$(ls dist/ModpackLauncher*.dmg | grep -v arm64 | head -1 | xargs basename)
          MAC_URL="https://github.com/Fport1/modpacklauncher/releases/download/v${VERSION}/${MAC_DMG// /.}"

          LINUX_APPIMAGE=$(ls dist/ModpackLauncher*.AppImage | head -1 | xargs basename)
          LINUX_URL="https://github.com/Fport1/modpacklauncher/releases/download/v${VERSION}/${LINUX_APPIMAGE// /.}"

          JSON=$(jq -n \
            --arg version "$VERSION" \
            --arg win32 "$WIN_URL" \
            --arg darwin "$MAC_URL" \
            --arg linux "$LINUX_URL" \
            '{version: $version, releaseNotes: "Nueva version disponible.", date: (now | strftime("%Y-%m-%d")), files: {win32: $win32, darwin: $darwin, linux: $linux}}')

          EXISTING=$(curl -s -H "Authorization: token $TOKEN" \
            https://api.github.com/repos/Fport1/modpacklauncher-updates/contents/update.json)
          SHA=$(echo "$EXISTING" | jq -r '.sha')

          CONTENT=$(echo "$JSON" | base64 -w 0)

          curl -s -X PUT \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Fport1/modpacklauncher-updates/contents/update.json \
            -d "{\"message\":\"Update to v${VERSION}\",\"content\":\"${CONTENT}\",\"sha\":\"${SHA}\"}"
