[package]
name = "fport1-native"
version = "0.1.0"
edition = "2021"
description = "Trabajos pesados de ModpackLauncher (hashes, zips, NBT, mundos) en un proceso aparte"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
