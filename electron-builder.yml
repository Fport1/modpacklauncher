appId: com.modpacklauncher.app

# De aqui sale app-update.yml dentro de la app y los latest*.yml de la release,
# que son el feed que consulta electron-updater.
publish:
  provider: github
  owner: Fport1
  repo: modpacklauncher
productName: ModpackLauncher
copyright: Copyright © 2024

fileAssociations:
  - ext: fpack
    name: Modpack fport1
    description: Modpack instalable para ModpackLauncher
    role: Editor
    mimeType: application/x-fpack

directories:
  buildResources: build
  output: dist

# Firma ad-hoc del .app en macOS (ver scripts/mac-adhoc-sign.js)
afterPack: scripts/mac-adhoc-sign.js

files:
  - out/**/*

extraResources:
  - from: resources/icons
    to: icons
    filter:
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  # Detecta instalación previa y la reemplaza automáticamente
  deleteAppDataOnUninstall: false
  # Permite instalar encima de versiones anteriores sin desinstalar antes
  allowElevation: true
  # Nombre del registro — debe ser el mismo en todas las versiones para que detecte la instalación previa
  uninstallDisplayName: ModpackLauncher

mac:
  target:
    # El zip es el que usa la autoactualizacion (Squirrel.Mac no sabe leer
    # un DMG); el DMG se mantiene para la instalacion inicial.
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.games
  extendInfo: build/mac-extra-info.plist
  # Con CSC_LINK en el entorno electron-builder firma con el Developer ID.
  # Sin él lo salta y se queda la firma ad-hoc del hook afterPack, que es lo
  # mínimo para que arranque en Apple Silicon.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  writeUpdateInfo: false

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Game
